<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Customer Manager</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #f4f7f9; padding: 2rem; color:#333; }
    h1 { margin-bottom: 1rem; }
    nav a { margin-right: 1rem; color: #0366d6; text-decoration:none; font-weight:600; }
    table { width:100%; border-collapse:collapse; background:#fff; border-radius:8px; margin-top:20px; overflow:hidden; box-shadow:0 2px 5px rgba(0,0,0,.05); }
    th,td{ border-bottom:1px solid #eee; padding:10px 12px; text-align:left; }
    th{ background:#f8f9fa; font-weight:600; }
    tr:hover td{ background:#f1f7ff; }
    input,button{ padding:8px 10px; border-radius:6px; border:1px solid #ccc; font-size:1em; }
    button{ background:#007bff; color:white; cursor:pointer; border:none; transition:.2s; }
    button:hover{ background:#0056b3; }
    button.delete-btn{ background:#c82333; }
    #status{ margin-top:1rem; padding:10px; border-radius:6px; display:none; }
    #status.success{ background:#d4edda; color:#155724; border:1px solid #c3e6cb; display:block;}
    #status.error{ background:#f8d7da; color:#721c24; border:1px solid #f5c6cb; display:block;}
  </style>
</head>
<body>
  <h1>Customer Manager</h1>
  <nav>
    <a href="/">🏠 Dashboard</a>
    <a href="/customers">👥 Customers</a>
    <a href="/settings">⚙️ Settings</a>
  </nav>

  <section style="margin-top:1.5rem;">
    <h3>Add New Customer</h3>
    <input id="name" placeholder="Customer name" />
    <input id="note" placeholder="Optional note" />
    <button id="addBtn">➕ Add & Provision</button>
  </section>

  <table id="customerTable">
    <thead>
      <tr>
        <th>ID</th><th>Name</th><th>DNS</th><th>Tunnel</th><th>Action</th>
      </tr>
    </thead>
    <tbody><tr><td colspan="5">Loading...</td></tr></tbody>
  </table>

  <div id="status"></div>

  <script>
    const AUTH_TOKEN = "0%7wQk0#KgUtbl3O"; // your worker token

    const tableBody = document.querySelector("#customerTable tbody");
    const statusBox = document.querySelector("#status");

    function showStatus(msg, ok = true) {
      statusBox.textContent = msg;
      statusBox.className = ok ? "success" : "error";
      statusBox.style.display = "block";
      setTimeout(() => (statusBox.style.display = "none"), 4000);
    }

    async function loadCustomers() {
      tableBody.innerHTML = "<tr><td colspan='5'>Loading...</td></tr>";
      try {
        const res = await fetch("/api/customers", {
          headers: { Authorization: "Bearer " + AUTH_TOKEN },
        });
        const data = await res.json();
        if (!data.length) {
          tableBody.innerHTML = "<tr><td colspan='5'>No customers yet.</td></tr>";
          return;
        }
        tableBody.innerHTML = data.map(c => `
          <tr>
            <td>${c.id}</td>
            <td>${c.name}<br><small>${c.note || "—"}</small></td>
            <td>${c.dns || "—"}</td>
            <td><code>${c.tunnel_uid || "—"}</code></td>
            <td><button class="delete-btn" data-id="${c.id}" data-name="${c.name}">Delete</button></td>
          </tr>
        `).join("");
      } catch (e) {
        showStatus(e.message, false);
      }
    }

    async function deleteCustomer(id, name) {
      if (!confirm(`Delete ${name}?`)) return;
      try {
        const res = await fetch(`/api/customers/${id}`, {
          method: "DELETE",
          headers: { Authorization: "Bearer " + AUTH_TOKEN },
        });
        if (res.ok || res.status === 204) {
          showStatus(`Deleted ${name}`, true);
          loadCustomers();
        } else {
          throw new Error(`Delete failed (${res.status})`);
        }
      } catch (e) {
        showStatus(e.message, false);
      }
    }

    async function addCustomer() {
      const name = document.querySelector("#name").value.trim();
      const note = document.querySelector("#note").value.trim();
      if (!name) return showStatus("Name is required", false);

      try {
        // Step 1: Create customer record
        const r1 = await fetch("/api/provision/customer", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            Authorization: "Bearer " + AUTH_TOKEN,
          },
          body: JSON.stringify({ name, note }),
        });
        const j1 = await r1.json();
        if (!r1.ok) throw new Error(j1.error || "Customer creation failed");
        const id = j1.customerId;

        // Step 2: Create tunnel
        showStatus("Creating tunnel...", true);
        const r2 = await fetch("/api/provision/tunnel_and_update", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            Authorization: "Bearer " + AUTH_TOKEN,
          },
          body: JSON.stringify({ customerId: id, name }),
        });
        const j2 = await r2.json();
        if (!r2.ok) throw new Error(j2.error || "Tunnel failed");

        // Step 3: Create DNS
        showStatus("Creating DNS...", true);
        const r3 = await fetch("/api/provision/dns", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            Authorization: "Bearer " + AUTH_TOKEN,
          },
          body: JSON.stringify({ customerId: id, tunnelUid: j2.tunnelUid }),
        });
        const j3 = await r3.json();
        if (!r3.ok) throw new Error(j3.error || "DNS failed");

        // Step 4: Add to Zero Trust
        showStatus("Adding to Zero Trust...", true);
        const r4 = await fetch("/api/provision/access", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            Authorization: "Bearer " + AUTH_TOKEN,
          },
          body: JSON.stringify({ customerDomain: j3.customerDomain }),
        });
        const j4 = await r4.json();
        if (!r4.ok) throw new Error(j4.error || "Zero Trust failed");

        showStatus(`Customer ${name} provisioned successfully`, true);
        loadCustomers();
      } catch (e) {
        showStatus(e.message, false);
      }
    }

    document.addEventListener("click", (e) => {
      const t = e.target;
      if (t.matches(".delete-btn")) deleteCustomer(t.dataset.id, t.dataset.name);
      if (t.matches("#addBtn")) addCustomer();
    });

    loadCustomers();
  </script>
</body>
</html>
